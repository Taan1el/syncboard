name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t syncboard:ci .
      - name: Run the container and check the UI
        run: |
          docker run -d --name syncboard -p 127.0.0.1:4000:4000 syncboard:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/ -o index.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          grep -qi '<div id="root"' index.html
          healthy=0
          for p in /health /api/health /healthz; do
            if curl -fsS http://127.0.0.1:4000$p > /dev/null; then echo "health ok at $p"; healthy=1; break; fi
          done
          test "$healthy" = "1"
      - name: Container logs
        if: always()
        run: docker logs syncboard || true
